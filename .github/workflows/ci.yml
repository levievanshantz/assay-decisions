name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-eval:
    name: Build + smoke + eval (verify mode)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run integration smoke pack (19 cases)
        run: node scripts/smoke-v2-integration.mjs

      - name: Run capability eval gate (verify mode only — adversarial requires live worker)
        run: node evals/run-all.mjs --mode=verify

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: evals/reports/
          retention-days: 30
